<!DOCTYPE html>
<html>
<head>
    <title>Nira Dashboard</title>

    <link rel="icon" href="/favicon.ico">

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .job-card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 500px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 15px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #333;
        }

        ul {
            padding-left: 20px;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Nira Dashboard</h1>

<div style="text-align:center;">
    <button onclick="logout()">Logout</button>
</div>

<div id="jobs"></div>

<script>
async function loadJobs() {

    const res = await fetch("/my-jobs");
    const data = await res.json();

    const container = document.getElementById("jobs");

    container.innerHTML = "";

    if (data.message) {
        container.innerHTML = `<h3 style="text-align:center;">${data.message}</h3>`;
        return;
    }

    data.forEach(job => {

        const percent =
            (job.slots_filled / job.slots_total) * 100;

        const div = document.createElement("div");
        div.className = "job-card";

        div.innerHTML = `
            <h2>${job.title}</h2>

            <p class="status">
                Status: ${job.status}
            </p>

            <p>
                Slots: ${job.slots_filled} / ${job.slots_total}
            </p>

            <div style="width:100%; background:#ddd; height:20px; border-radius:10px;">
                <div style="
                    width:${percent}%;
                    height:100%;
                    background:${percent > 80 ? 'red' : percent > 50 ? 'orange' : 'green'};
                    border-radius:10px;
                "></div>
            </div>

            <button onclick="closeJob(${job.id})">
                Close Job
            </button>

            <h3>Applicants</h3>

            <ul>
                ${
                    job.applicants.length > 0
                    ?
                    job.applicants.map(a =>
                        `<li>${a.name} - ${a.phone}</li>`
                    ).join("")
                    :
                    "<li>No applicants yet</li>"
                }
            </ul>
        `;

        container.appendChild(div);
    });
}

async function closeJob(jobId) {

    const res = await fetch("/close-job", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ jobId })
    });

    const data = await res.json();

    alert(data.message);

    loadJobs();
}

async function logout() {

    await fetch("/logout");

    window.location.href = "/login";
}

loadJobs();
</script>

</body>
</html>
